<!doctype html>
<html lang="fa" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظرسنجی موکب شهدای کندر</title>
  <style>
/* فونت‌ها: لاله‌زار برای عنوان (حس سنتی/خوشنویسی) و وزیرمتن برای متن بدنه */
@import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --bg-deep:#070b1a;
  --bg-mid:#121b42;
  --navy:#1c2b5c;
  --blue:#4c6fcf;
  --blue-light:#8b9dff;
  --cyan:#71e6db;
  --cyan-bright:#a8f2ea;
  --text:#f7f9ff;
  --muted:#c6cbea;
}

* { box-sizing:border-box; }

html {
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}

body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:'Vazirmatn', Tahoma, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 0;
  -webkit-overflow-scrolling:touch;
  background:
    radial-gradient(circle at 18% 15%, rgba(76,111,207,.28) 0%, transparent 38%),
    radial-gradient(circle at 82% 85%, rgba(113,230,219,.16) 0%, transparent 34%),
    linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #0a1130);
}

#particles {
  position:fixed;
  inset:0;
  z-index:0;
}

.wrap {
  position:relative;
  z-index:2;
  width:min(92%, 540px);
}

.leaders-banner {
  width:76px;
  height:76px;
  margin:0 auto 14px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(113,230,219,.35);
  box-shadow: 0 8px 22px rgba(0,0,0,.4);
  animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
}

.leaders-banner img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

@media(max-width:480px){
  .leaders-banner { width:64px; height:64px; }
}

/* کارت شیشه‌ای */
.card {
  position:relative;
  overflow:hidden;
  padding:44px 30px 30px;
  border-radius:26px;
  background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(20,30,70,.18));
  border: 1px solid rgba(113,230,219,.28);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 25px 80px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.2);
  animation: rise .7s cubic-bezier(.2,.8,.2,1) both, float 7s 0.7s ease-in-out infinite;
}

@keyframes rise {
  from { opacity:0; transform: translateY(22px) scale(.98); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

/* نوار نور ظریف که از روی کارت عبور می‌کند */
.card::before {
  content:"";
  position:absolute;
  top:-80%;
  left:-60%;
  width:38%;
  height:260%;
  background: linear-gradient(90deg, transparent, rgba(168,242,234,.2), transparent);
  transform: rotate(24deg);
  filter: blur(6px);
  animation: shine 7s ease-in-out infinite;
  pointer-events:none;
}

/* --- نشان / لوگوی فانوس --- */
.badge-wrap {
  display:flex;
  justify-content:center;
  margin-bottom:6px;
}

.logo {
  position:relative;
  width:150px;
  animation: logo-in .8s cubic-bezier(.2,.8,.2,1) both, logo-glow 3.2s 0.8s ease-in-out infinite;
}

.logo img {
  width:100%;
  display:block;
  filter: drop-shadow(0 0 16px rgba(255,90,90,.35));
}

@keyframes logo-in {
  from { opacity:0; transform: translateY(-10px) scale(.9); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

@keyframes logo-glow {
  0%, 100% { filter: drop-shadow(0 0 14px rgba(255,90,90,.3)); }
  50%      { filter: drop-shadow(0 0 24px rgba(255,90,90,.55)); }
}

h1 {
  text-align:center;
  margin:14px 0 0;
  font-family:'Lalezar', 'Vazirmatn', sans-serif;
  font-weight:400;
  letter-spacing:.5px;
  font-size:clamp(24px, 6.2vw, 33px);
  color: var(--cyan-bright);
  text-shadow: 0 0 22px rgba(113,230,219,.3);
}

/* جداکننده تزئینی */
.divider {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:14px 0 16px;
}
.divider .line {
  height:1px;
  width:46px;
  background: linear-gradient(90deg, transparent, rgba(113,230,219,.65));
}
.divider .line.left { background: linear-gradient(270deg, transparent, rgba(113,230,219,.65)); }
.divider .dot {
  width:6px; height:6px;
  transform: rotate(45deg);
  background: var(--cyan);
  box-shadow: 0 0 8px rgba(113,230,219,.7);
}

.subtitle {
  text-align:center;
  color:var(--muted);
  line-height:2;
  margin:0 0 26px;
  font-size:14px;
}

label {
  display:block;
  margin:0 4px 9px;
  color:#e8ebff;
  font-size:14px;
}

textarea {
  width:100%;
  min-height:160px;
  resize:vertical;
  border: 1px solid rgba(255,255,255,.22);
  border-radius:16px;
  padding:16px;
  outline:none;
  color:#fff;
  font:inherit;
  line-height:1.9;
  background: rgba(3,8,28,.3);
  transition: .3s;
}

textarea::placeholder { color:#adb5d2; }

textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 4px rgba(113,230,219,.12), 0 0 26px rgba(113,230,219,.14);
}

textarea.input-error {
  border-color: #e05a5a;
  box-shadow: 0 0 0 4px rgba(224,90,90,.14);
}

.char-counter {
  text-align:left;
  font-size:12px;
  color: var(--muted);
  margin-top:6px;
  opacity:.75;
}

.char-counter.limit-near { color:#f0c869; }
.char-counter.limit-over { color:#e05a5a; }

/* فیلد تله ضد اسپم - همیشه مخفیه، فقط رباتها پرش می‌کنن */
.honeypot {
  position:absolute;
  left:-9999px;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

button {
  position:relative;
  width:100%;
  border:0;
  cursor:pointer;
  margin-top:18px;
  padding:15px;
  border-radius:14px;
  color:#07132b;
  font:700 16px 'Vazirmatn';
  background: linear-gradient(100deg, var(--blue-light), var(--cyan), var(--blue-light));
  background-size: 220% 100%;
  box-shadow: 0 12px 28px rgba(113,230,219,.2);
  transition: .3s;
  overflow:hidden;
}

button:hover {
  transform: translateY(-3px);
  background-position: 100% 0;
  box-shadow: 0 16px 36px rgba(113,230,219,.35);
}

button:active { transform: scale(.98); }

button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--cyan-bright);
  outline-offset: 2px;
}

#status {
  min-height:26px;
  text-align:center;
  margin:15px 0 0;
  color: var(--cyan-bright);
  font-size:14.5px;
  font-weight:600;
}

#status.show {
  animation: status-in .5s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes status-in {
  from { opacity:0; transform: translateY(6px); }
  to   { opacity:1; transform: translateY(0); }
}

/* --- پنل پیام موفقیت (وسط صفحه) --- */
.modal-overlay {
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background: rgba(4,8,22,.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity:0;
  visibility:hidden;
  transition: opacity .35s ease, visibility .35s ease;
}

.modal-overlay.show {
  opacity:1;
  visibility:visible;
}

.modal-panel {
  position:relative;
  width:min(92%, 380px);
  text-align:center;
  padding:36px 26px 28px;
  border-radius:22px;
  background: linear-gradient(150deg, rgba(255,255,255,.16), rgba(20,30,70,.24));
  border: 1px solid rgba(113,230,219,.32);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 30px 90px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.2);
  transform: translateY(14px) scale(.94);
  opacity:0;
  transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
}

.modal-overlay.show .modal-panel {
  transform: translateY(0) scale(1);
  opacity:1;
}

.modal-icon {
  width:64px;
  height:64px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle, rgba(113,230,219,.28), rgba(113,230,219,.05));
  border: 1px solid rgba(113,230,219,.4);
  box-shadow: 0 0 30px rgba(113,230,219,.35);
}

.modal-icon svg {
  width:30px;
  height:30px;
}

.modal-icon path {
  stroke: var(--cyan-bright);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 30;
  stroke-dashoffset: 30;
  animation: draw-check .5s .25s ease forwards;
}

@keyframes draw-check {
  to { stroke-dashoffset: 0; }
}

.modal-panel h3 {
  margin:0 0 8px;
  font-family:'Lalezar','Vazirmatn',sans-serif;
  font-weight:400;
  font-size:22px;
  color: var(--cyan-bright);
}

.modal-panel p {
  margin:0 0 22px;
  color: var(--muted);
  font-size:14px;
  line-height:1.9;
}

.modal-close {
  width:auto;
  display:inline-block;
  padding:10px 30px;
  margin:0;
  font-size:14px;
  box-shadow:none;
}

@keyframes shine {
  0%, 20% { left: -70%; opacity: 0; }
  40%     { opacity: 1; }
  70%, 100% { left: 145%; opacity: 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

@media (prefers-reduced-motion: reduce) {
  .card, .card::before, .flame, .glow-ring { animation: none !important; }
}

@media(max-width:480px){
  .card { padding:36px 20px 22px; border-radius:22px; }
  textarea { min-height:145px; }
  .logo { width:120px; }
}

/* --- فوتر: طراحی و توسعه --- */
.site-footer {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:18px;
}

.site-footer span {
  font-size:12.5px;
  font-weight:600;
  color:#ffffff;
  text-shadow: 0 0 10px rgba(113,230,219,.8), 0 0 4px rgba(113,230,219,.6);
}

.site-footer img {
  width:16px;
  height:16px;
  object-fit:contain;
  opacity:.9;
}
</style>
 </head>
 <body>
  <canvas id="particles"></canvas>
  <main class="wrap">
   <div class="leaders-banner">
    <img src="leaders.png" alt="مقام معظم رهبری و بزرگان">
   </div>
   <section class="card">
    <div class="badge-wrap">
     <div class="logo">
      <img src="logo.png" alt="لوگوی شهدای کندر">
     </div>
    </div>
    <h1>نظرتان درباره موکب شهدای کندر</h1>
    <div class="divider">
     <span class="line left"></span><span class="dot"></span><span class="line"></span>
    </div>
    <p class="subtitle">برای بهبود عملکرد موکب، پیشنهادات و انتقادات خود را با ما در میان بگذارید</p>
    <!-- فراموش نکنید: آدرس Formspree خود را در قسمت action جایگزین کنید -->
    <form id="feedbackForm">
     <label for="message">نظر شما به‌صورت کاملاً ناشناس ارسال خواهد شد</label> <textarea id="message" name="message" required maxlength="2000" placeholder="نظر خود را اینجا بنویسید..."></textarea>
     <div class="char-counter" id="charCounter">۰ / ۲۰۰۰</div>
     <!-- فیلد تله برای ربات‌ها: کاربر واقعی این رو نمی‌بینه و نباید پر بشه -->
     <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="honeypot"> <!-- فیلد تله موردنیاز splitforms برای ضدهرزنامه (طبق مستندات، حتماً باید چک‌باکس باشه) -->
     <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off"> <input type="hidden" name="form_loaded_at" id="formLoadedAt">
     <button type="submit">ارسال نظر ناشناس ✨</button>
    </form>
    <p id="status"></p>
   </section>
   <footer class="site-footer">
    <span>طراحی و توسعه توسط تیم سدرة المنتهی</span> <img src="sedrat-logo.png" alt="لوگوی تیم سدرة المنتهی">
   </footer>
  </main>
  <!-- پنل پیام موفقیت -->
  <div class="modal-overlay" id="successModal">
   <div class="modal-panel">
    <div class="modal-icon">
     <svg viewBox="0 0 24 24">
      <path d="M4 12.5 L9.5 18 L20 6" />
     </svg>
    </div>
    <h3>ارسال شد</h3>
    <p>از نظر شما سپاسگزاریم 🌿</p>
    <button type="button" class="modal-close" id="modalCloseBtn">باشه</button>
   </div>
  </div>
  <script>
/* --- ذرات شناور در پس‌زمینه --- */
const canvas = document.getElementById('particles'),
      ctx = canvas.getContext('2d');
let dots = [];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const count = reduceMotion ? 0 : Math.min(90, Math.floor(window.innerWidth / 12));
  dots = Array.from({ length: count }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    a: Math.random() * 0.65 + 0.15
  }));
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  dots.forEach(d => {
    d.x += d.vx;
    d.y += d.vy;
    if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
    if (d.y < 0 || d.y > canvas.height) d.vy *= -1;

    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(174, 219, 255, ${d.a})`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#7ee7e0';
    ctx.fill();
  });
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();

/* --- مدیریت فرم (ارسال با AJAX تا splitforms، بدون تغییر صفحه) --- */
const form = document.getElementById('feedbackForm');
const SPLITFORMS_ENDPOINT = 'https://splitforms.com/api/submit';

// Access Key دو فرمی که توی splitforms ساختید رو اینجا جایگزین کنید
const ACCESS_KEY_1 = '  8b5c838b3225444b9d3fb655c2f3c42c';
const ACCESS_KEY_2 = '  958b12ede12d467db201eed9673de242';

const formLoadedAtField = document.getElementById('formLoadedAt');
formLoadedAtField.value = Date.now();

const statusEl = document.getElementById('status');
const submitBtn = form.querySelector('button[type="submit"]');
const successModal = document.getElementById('successModal');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const messageField = document.getElementById('message');
const charCounter = document.getElementById('charCounter');
const honeypotField = form.querySelector('input[name="_gotcha"]');
const MAX_LEN = 2000;

/* شمارنده‌ی کاراکتر با اعداد فارسی */
function toPersianDigits(n) {
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).replace(/\d/g, d => fa[d]);
}
function updateCounter() {
  const len = messageField.value.length;
  charCounter.textContent = `${toPersianDigits(len)} / ${toPersianDigits(MAX_LEN)}`;
  charCounter.classList.toggle('limit-near', len > MAX_LEN * 0.9);
}
messageField.addEventListener('input', () => {
  updateCounter();
  messageField.classList.remove('input-error');
});
updateCounter();

/* --- فیلتر الفاظ نامناسب (سمت کاربر) --- */
const bannedWords = [
  'کیر','کص','کوس','کونی','جنده','گاییدم','گاییده','گائیدم',
  'حرومزاده','حروم زاده','مادرجنده','ننه جنده','کسکش','جاکش',
  'kir','kos','koon','jende','koni'
];

function normalizeText(str) {
  return str
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '') // حذف اعراب عربی/فارسی
    .replace(/ي/g, 'ی')
    .replace(/ك/g, 'ک')
    .replace(/[\s.\-_*]+/g, ''); // حذف فاصله و کاراکترهای رایج برای دور زدن فیلتر
}
const normalizedBanned = bannedWords.map(normalizeText);

function containsProfanity(text) {
  const normalized = normalizeText(text);
  return normalizedBanned.some(w => w && normalized.includes(w));
}

function showError(msg) {
  statusEl.style.color = '#ff8b8b';
  statusEl.textContent = msg;
  statusEl.classList.remove('show');
  void statusEl.offsetWidth; // ری‌استارت انیمیشن
  statusEl.classList.add('show');
}

/* --- جلوگیری از ارسال پشت‌سرهم (ضد اسپم) --- */
const COOLDOWN_MS = 20000;
function remainingCooldown() {
  const last = parseInt(localStorage.getItem('lastFeedbackSubmit') || '0', 10);
  const diff = Date.now() - last;
  return diff < COOLDOWN_MS ? Math.ceil((COOLDOWN_MS - diff) / 1000) : 0;
}

function openModal() {
  successModal.classList.add('show');
}
function closeModal() {
  successModal.classList.remove('show');
}
modalCloseBtn.addEventListener('click', closeModal);
successModal.addEventListener('click', e => {
  if (e.target === successModal) closeModal();
});

form.addEventListener('submit', async e => {
  e.preventDefault();

  // فیلد تله: اگه پر شده باشه یعنی ربات بوده، بی‌سروصدا رد می‌کنیم
  if (honeypotField.value) return;

  const text = messageField.value.trim();

  if (text.length < 3) {
    showError('لطفاً نظر خود را کامل‌تر بنویسید.');
    messageField.classList.add('input-error');
    return;
  }

  if (containsProfanity(text)) {
    showError('لطفاً از الفاظ محترمانه استفاده کنید 🙏');
    messageField.classList.add('input-error');
    return;
  }

  const remaining = remainingCooldown();
  if (remaining > 0) {
    showError(`لطفاً ${toPersianDigits(remaining)} ثانیه صبر کنید و دوباره تلاش کنید.`);
    return;
  }

  const originalBtnText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = 'در حال ارسال...';
  statusEl.classList.remove('show');
  statusEl.textContent = '';

  try {
    // برای هر ایمیل، یه فرم‌دیتای جدا با access_key مربوط به همون فرم می‌سازیم
    function buildPayload(accessKey) {
      const fd = new FormData(form);
      fd.set('access_key', accessKey);
      return fd;
    }

    const requests = [
      fetch(SPLITFORMS_ENDPOINT, {
        method: 'POST',
        body: buildPayload(ACCESS_KEY_1),
        headers: { 'Accept': 'application/json' }
      })
    ];

    // اگه Access Key دوم پر شده باشه، هم‌زمان به اون ایمیل هم ارسال می‌کنیم
    if (ACCESS_KEY_2 && ACCESS_KEY_2 !== 'PASTE_SECOND_ACCESS_KEY_HERE') {
      requests.push(
        fetch(SPLITFORMS_ENDPOINT, {
          method: 'POST',
          body: buildPayload(ACCESS_KEY_2),
          headers: { 'Accept': 'application/json' }
        }).catch(() => null) // اگه فرم دوم خطا داد، جلوی نمایش موفقیت فرم اول رو نگیره
      );
    }

    const [primaryResponse] = await Promise.all(requests);

    if (primaryResponse.ok) {
      localStorage.setItem('lastFeedbackSubmit', Date.now().toString());
      form.reset();
      updateCounter();
      openModal();
      setTimeout(closeModal, 4000);
    } else {
      showError('خطا در ارسال. لطفاً دوباره تلاش کنید.');
    }
  } catch (err) {
    showError('خطا در اتصال. لطفاً دوباره تلاش کنید.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = originalBtnText;
  }
});

</script>
 </body>
</html>
